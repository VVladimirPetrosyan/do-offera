# Render Blueprint for the do-offera API (free plan, Docker image:
# web + celery worker in one container). Deploy: Render dashboard →
# Blueprint → point at this repo. All secrets are set manually in the
# dashboard — sync: false keeps them out of git.
services:
  - type: web
    name: dooffera-cloud-draft
    runtime: docker
    plan: free
    rootDir: api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: B24_WEBHOOK_URL
        sync: false
      - key: B24_EVENT_SECRET
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
